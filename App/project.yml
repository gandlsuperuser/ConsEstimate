name: ConsEstimate
options:
  bundleIdPrefix: com.consestimate
  deploymentTarget:
    iOS: "17.0"
targets:
  ConsEstimate:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ConsEstimate
    info:
      path: ConsEstimate/Info.plist
      properties:
        CFBundleDisplayName: "ConsEstimate"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.consestimate.app
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
